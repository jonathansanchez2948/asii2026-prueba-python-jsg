# Pipeline de integración continua para Azure DevOps (equivalente a .github/workflows/ci.yml)

# Se ejecuta en cada push a main
trigger:
  branches:
    include:
      - main

# Se ejecuta en cada pull request hacia main
pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python310:
      python.version: "3.10"
    Python311:
      python.version: "3.11"
    Python312:
      python.version: "3.12"

steps:
  - task: UsePythonVersion@0
    displayName: Configurar Python $(python.version)
    inputs:
      versionSpec: $(python.version)

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: Instalar dependencias

  - script: flake8 . --max-line-length=120 --exclude=.git,__pycache__,.venv
    displayName: Análisis estático con flake8

  - script: pytest --junitxml=resultados-pruebas.xml
    displayName: Ejecutar pruebas con pytest

  - task: PublishTestResults@2
    displayName: Publicar resultados de las pruebas
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: resultados-pruebas.xml
      testRunTitle: Python $(python.version)
